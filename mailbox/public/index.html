<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mailbox - jac</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Mailbox</div>
      <div class="identity" id="identity" title="every message is sent as this identity">
        acting as <strong id="me">jac</strong>
      </div>
      <!-- Status is fully built but HIDDEN: post_status rejects the operator_mailbox
           seat ("unknown agent" - jac is an actor, not an agent). Requested the fix
           from agentcomms-architect; remove `hidden` (and re-add tests/status.mjs to
           the verify script) once the seat can publish status. -->
      <div class="status-wrap" id="statusWrap" hidden>
        <button class="btn ghost" id="statusBtn" type="button">Status</button>
        <span class="status-display" id="statusDisplay" title="Last status set in this app. The server has no status read-back."></span>
        <form class="status-popover" id="statusForm" hidden>
          <label for="statusSummary">Summary</label>
          <input id="statusSummary" required placeholder="Current status" />
          <label for="statusNext">Next step</label>
          <input id="statusNext" placeholder="Next step" />
          <div class="status-actions">
            <button class="btn ghost" type="button" id="statusCancel">Cancel</button>
            <button class="btn primary" type="submit" id="statusPublish">Publish</button>
          </div>
        </form>
      </div>
      <button class="btn ghost" id="statusBoardBtn" type="button" hidden>Status board</button>
      <button class="btn primary" id="composeBtn">Compose</button>
    </header>

    <main class="layout" id="layout">
      <section class="pane list" id="listPane" aria-label="Inbox">
        <div class="pane-head">
          <span class="pane-title">Inbox <span class="unread-total" id="unreadTotal" title="unread messages" hidden></span></span>
          <button class="btn ghost" id="refreshBtn" title="reload inbox">Refresh</button>
        </div>
        <div class="filter-bar" id="filters" role="group" aria-label="Filter inbox">
          <button class="filter active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="unread">Unread</button>
          <button class="filter" type="button" data-filter="ack">Needs ack</button>
        </div>
        <ul class="messages" id="messages"></ul>
        <div class="empty" id="listEmpty" hidden>No messages.</div>
        <div class="list-note" id="listNote" hidden></div>
      </section>

      <section class="pane reading" id="readingPane" aria-label="Reading">
        <button class="btn ghost back" id="backBtn" hidden>&larr; Inbox</button>
        <div class="placeholder" id="placeholder">Select a message to read.</div>

        <section class="status-board" id="statusBoard" hidden>
          <h2>Status board</h2>
          <div class="status-board-list" id="statusBoardList"></div>
        </section>

        <article class="reader" id="reader" hidden>
          <h2 class="subject" id="rSubject"></h2>
          <div class="meta">
            <span id="rFrom"></span>
            <span id="rTo" class="muted-wrap"></span>
            <span id="rWhen"></span>
            <span class="priority-badge" id="rPriority" hidden></span>
            <button class="btn ghost small" type="button" id="closeMsgBtn"
              title="Remove this message from the inbox (close_message). Does not delete it.">Close message</button>
          </div>
          <div class="body" id="rBody"></div>

          <div class="ack-box" id="ackBox" hidden>
            <input id="ackResponse" placeholder="Optional acknowledgement response" />
            <button class="btn primary" type="button" id="ackBtn">Acknowledge</button>
          </div>

          <div class="sender-all" id="senderAll" hidden>
            <button class="btn ghost" type="button" id="viewAllBtn"></button>
            <div class="sender-all-list" id="senderAllList" hidden></div>
          </div>

          <details class="thread" id="threadBox" hidden>
            <summary>Earlier in thread (<span id="threadCount">0</span>)</summary>
            <div id="threadList"></div>
          </details>

          <form class="reply" id="replyForm">
            <label for="replyBody">Reply</label>
            <div class="reply-to">
              <span id="replyTo"></span>
              <label class="check" id="replyAllWrap" hidden>
                <input type="checkbox" id="rReplyAll" />
                <span id="replyAllLabel">Reply all</span>
              </label>
            </div>
            <textarea id="replyBody" rows="3" placeholder="Write a reply..."></textarea>
            <div class="reply-actions">
              <span class="sending-as">sending as jac</span>
              <button class="btn ghost" type="button" id="quoteBtn" title="Insert the message you are replying to, quoted">Quote</button>
              <label class="check" title="Ask the recipient to acknowledge this reply">
                <input type="checkbox" id="rAck" /> Request ack
              </label>
              <button class="btn primary" type="submit" id="replySend">Send</button>
            </div>
          </form>
        </article>

        <form class="compose-pane" id="composeForm" hidden>
          <h3>New message <span class="sending-as">as jac</span></h3>
          <label for="cTo">To</label>
          <div class="recipient-input" id="recipientInput">
            <div class="recipient-chips" id="recipientChips"></div>
            <input id="cTo" list="actorList" placeholder="actor id (space, comma or Enter adds it)" autocomplete="off" />
          </div>
          <datalist id="actorList"></datalist>
          <label for="cSubject">Subject</label>
          <input id="cSubject" placeholder="Subject" />
          <label for="cBody">Body</label>
          <textarea id="cBody" rows="8" placeholder="Write your message..."></textarea>
          <div class="compose-options">
            <label class="check" title="Ask every recipient to acknowledge this message">
              <input type="checkbox" id="cAck" /> Request ack
            </label>
            <label class="check">Priority
              <select id="cPriority">
                <option value="normal">normal</option>
                <option value="high">high</option>
                <option value="blocker">blocker</option>
              </select>
            </label>
          </div>
          <div class="compose-actions">
            <span class="sending-as">sending as jac</span>
            <span class="draft-status" id="draftStatus" aria-live="polite"></span>
            <button class="btn ghost" type="button" id="composeDiscard">Discard draft</button>
            <button class="btn ghost" type="button" id="composeCancel">Close</button>
            <button class="btn primary" type="submit" id="composeSend">Send</button>
          </div>
        </form>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
